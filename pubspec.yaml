name: tournament_creator_front
description: "Frontend do Tournament Creator com arquitetura Feature-First e Dumb UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.0.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  signalr_netcore: ^1.4.4
  intl: ^0.20.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/heroes/icons/
    - assets/heroes/horizontal/
    - assets/items/

